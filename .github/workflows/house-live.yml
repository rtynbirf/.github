name: house-live · цифры = территории (реального времени)
# Автомат Хозяина: каждые 30 минут счёт, SSOT-refs, мембраны, красные, ledger.
# Канон: .github/AGENTS.md · файл-пин по ТЗ-Г (SHA) · дозор (чужая волна <2ч не трогается).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

concurrency:
  group: house-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Живая сверка и синхронизация
        env:
          LIVE_TOKEN: ${{ secrets.ACCOUNT_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/house_live_sync.py
