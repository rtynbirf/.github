name: РЕВО АККАУНТ
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ковка паспорта аккаунта
        run: python3 revo_account.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: самозапись изменений (патч + 3-way apply, 5 попыток)
        run: |
          git config user.name "revo[bot]"
          git config user.email "revo[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "паспорт аккаунта не изменился — писать нечего"
            exit 0
          fi
          git diff --cached > /tmp/revo.patch
          git reset --hard -q HEAD
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet || true
            git reset --hard -q origin/main
            if git apply --3way /tmp/revo.patch 2>/dev/null; then
              git add -A
              if git diff --cached --quiet; then
                echo "патч уже лежит на main — записывать нечего (попытка $attempt)"
                pushed=1
                break
              fi
              git commit -q -m "автопилот РЕВО: паспорт аккаунта перекован — REVE=РЕВО"
              if git push --quiet; then
                echo "запись легла с попытки $attempt"
                pushed=1
                break
              fi
              echo "гонка за main: территория ушла во время записи — перечитать и повторить (попытка $attempt)"
            else
              echo "патч не лег на свежий main без конфликта — попытка $attempt"
            fi
            sleep 15
          done
          [ "$pushed" -eq 1 ] || { echo "main не принял запись за 5 попыток — честный красный"; exit 1; }
