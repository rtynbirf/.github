name: Bug report
description: Сообщить о проблеме
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло?
      description: Шаги воспроизведения, ожидаемое поведение и фактическое.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншоты
      description: Всё, что помогает увидеть проблему.
    validations:
      required: false
