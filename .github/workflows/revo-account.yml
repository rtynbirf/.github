name: РЕВО АККАУНТ
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ковка паспорта аккаунта
        run: python3 revo_account.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: самозапись изменений (регенерация на свежем main, 5 попыток)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "revo[bot]"
          git config user.email "revo[bot]@users.noreply.github.com"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet || true
            git reset --hard -q origin/main
            [ -f revo_account.py ] && python3 revo_account.py || echo "revo_account.py отсутствует — пропуск генерации"
            git add -A
            if git diff --cached --quiet; then
              echo "паспорт аккаунта на main уже свежий — писать нечего (попытка $attempt)"
              pushed=1
              break
            fi
            git commit -q -m "автопилот РЕВО: паспорт аккаунта перекован — REVE=РЕВО"
            if git push origin HEAD:main --quiet; then
              echo "запись легла с попытки $attempt"
              pushed=1
              break
            fi
            echo "гонка за main: территория ушла — перечитать, перегенерировать и повторить (попытка $attempt)"
            sleep 15
          done
          [ "$pushed" -eq 1 ] || { echo "main не принял запись за 5 попыток — честный красный"; exit 1; }
