name: account-facade

# Волна ×4 (2026-11-11): П36 — машинный фасад аккаунта не врёт.
#  1. llms-account.txt == живой GitHub API (имена и счёт; расхождение = красный);
#  2. .github/CODEOWNERS == канон генератора (дефолт-владелец аккаунта);
#  3. самозалечка: если фасад отстал от API — автоген коммитит свежий файл.
# Strict-проверка приватного среза требует secret ACCOUNT_TOKEN (PAT с read
# правами): без него честно проверяется публичный срез (анонимный API).
# Протокол тишины A-HUSH (волна ×1176, 2026-11-18):
#  Зуб 1 — линт получает грейс 3×60 с (гонка с house-live за push: фасад догоняет
#  API — транзитная расходимость не тревога);
#  Зуб 2 — пуш самозалечки получает 3 попытки fetch+rebase+push (гонка за main);
#  Зуб 3 — «тревога однажды»: issue alarm:facade открывается один раз
#  (когда selfheal не спас), разряжается при зелёном фасаде.

permissions:
  contents: write
  issues: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '37 3 * * 1' # еженедельно, понедельник
  workflow_dispatch:
concurrency:
  group: account-facade
  cancel-in-progress: false

jobs:
  facade:
    name: фасад против живого API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: линт llms-account.txt (грейс A-HUSH, дрейф такта перепроверяется)
        env:
          GITHUB_TOKEN: ${{ secrets.ACCOUNT_TOKEN || '' }}
        run: |
          for i in 1 2 3; do
            if python3 tools/lint-account-llms-txt.py --file llms-account.txt; then echo "фасад = API (попытка $i)"; exit 0; fi
            echo "фасад расходится с API — гонка с house-live? перепроверка через 120 с (окно ≥ цикла самозалечки) (попытка $i/3)"
            sleep 120
          done
          echo "фасад расходится надлого — честный красный"
          exit 2
      - name: канон CODEOWNERS
        run: python3 tools/generate-codeowners.py --check .github/CODEOWNERS

  selfheal:
    name: самозалечка фасада (если линт красный)
    runs-on: ubuntu-latest
    needs: [facade]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: перегенерация фасада из живого API
        env:
          GITHUB_TOKEN: ${{ secrets.ACCOUNT_TOKEN || '' }}
        run: python3 tools/generate-account-llms-txt.py --out llms-account.txt
      - name: коммит свежего фасада (3 попытки — гонка за main, зуб A-HUSH)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms-account.txt
          if git diff --cached --quiet; then
            echo "фасад уже канон — красный линт был от rate-limit/сети, лечить нечего"
            exit 0
          fi
          git commit -m "facade: автоген llms-account.txt — живой API (selfheal П36)"
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main --quiet || true
            git rebase --autostash origin/main --quiet || git rebase --abort || true
            if git push; then
              echo "фасад вписан с попытки $attempt"
              pushed=1
              break
            fi
            echo "гонка за main: территория ушла во время записи — перечитать и повторить (попытка $attempt)"
            sleep 15
          done
          [ "$pushed" -eq 1 ] || { echo "пуш не прошёл за 3 попытки — честный красный"; exit 1; }

  alarm:
    name: тревога однажды (circuit breaker)
    runs-on: ubuntu-latest
    needs: [facade, selfheal]
    if: always()
    steps:
      - name: разоружение (фасад зелёный — страж молчит и снова вооружён)
        if: needs.facade.result == 'success' || needs.selfheal.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:facade" --json number -q '.[].number' \
            | while read n; do gh issue close "$n" -R "$GITHUB_REPOSITORY" -c "фасад сверен/залечен (run ${{ github.run_id }}) — страж разряжен, тревога снята"; done
      - name: тревога однажды (issue открывается один раз)
        if: needs.facade.result == 'failure' && needs.selfheal.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "alarm:facade" -R "$GITHUB_REPOSITORY" --color b60205 --description "фасад расходится с живым API надлого" --force 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label "alarm:facade" --json number -q 'length')
          if [ "$open" -eq 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              -t "ALARM: фасад расходится с живым API" \
              -b "run ${{ github.run_id }} — линт красный после 3 перепроверок, самозалечка не спасла. Проверить: tools/lint-account-llms-txt.py, rate-limit, ACCOUNT_TOKEN. Пока issue открыта — страж молчит (протокол A-HUSH)." \
              -l "alarm:facade"
          else
            echo "тревога уже открыта ($open) — молчим"
          fi
