name: account-facade

# Волна ×4 (2026-11-11): П36 — машинный фасад аккаунта не врёт.
#  1. llms-account.txt == живой GitHub API (имена и счёт; расхождение = красный);
#  2. .github/CODEOWNERS == канон генератора (дефолт-владелец аккаунта);
#  3. самозалечка: если фасад отстал от API — автоген коммитит свежий файл.
# Strict-проверка приватного среза требует secret ACCOUNT_TOKEN (PAT с read
# правами): без него честно проверяется публичный срез (анонимный API).

permissions:
  contents: write

on:
  push:
    branches:
      - main
  schedule:
    - cron: '37 3 * * 1' # еженедельно, понедельник
  workflow_dispatch:

jobs:
  facade:
    name: фасад против живого API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: линт llms-account.txt
        env:
          GITHUB_TOKEN: ${{ secrets.ACCOUNT_TOKEN || '' }}
        run: python3 tools/lint-account-llms-txt.py --file llms-account.txt
      - name: канон CODEOWNERS
        run: python3 tools/generate-codeowners.py --check .github/CODEOWNERS

  selfheal:
    name: самозалечка фасада (если линт красный)
    runs-on: ubuntu-latest
    needs: [facade]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: перегенерация фасада из живого API
        env:
          GITHUB_TOKEN: ${{ secrets.ACCOUNT_TOKEN || '' }}
        run: python3 tools/generate-account-llms-txt.py --out llms-account.txt
      - name: коммит свежего фасада
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms-account.txt
          if git diff --cached --quiet; then
            echo "фасад уже канон — красный линт был от rate-limit/сети, лечить нечего"
          else
            git commit -m "facade: автоген llms-account.txt — живой API (selfheal П36)"
            git push
          fi
